name: Nifty TRI Daily Update

on:
  schedule:
    - cron: '30 15 * * 1-5'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write service account credentials
        run: |
          mkdir -p credentials
          echo "${{ secrets.GCP_SA_KEY_B64 }}" | base64 -d > credentials/service_account.json

      - name: Stage 1 — Fetch from niftyindices.com
        run: python src/fetch_niftyindices.py

      - name: Stage 2 — Write to Google Sheets
        run: python src/write_to_sheets.py

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: snapshot $(date -u +%Y-%m-%d)"
          # Rebase on top of any commits the monthly workflow may have pushed
          # in parallel, then push. Prevents race conditions on days 28-31.
          git pull --rebase origin main
          git push

      - name: Clean up credentials
        if: always()
        run: rm -f credentials/service_account.json
