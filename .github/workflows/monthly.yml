name: Nifty Sectoral Monthly Update

on:
  schedule:
    # 9:00 PM IST = 15:30 UTC, on days 28-31 of every month.
    # The fetch script self-filters to only run on the actual last day,
    # so 3 of these 4 triggers exit early without doing work.
    - cron: '30 15 28-31 * *'
  workflow_dispatch:  # Manual trigger always available

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write service account credentials
        run: |
          mkdir -p credentials
          echo "${{ secrets.GCP_SA_KEY_B64 }}" | base64 -d > credentials/service_account.json

      - name: Stage 1 — Fetch sectoral TRI from niftyindices.com
        run: python src/fetch_sectoral.py

      - name: Stage 2 — Write sectoral data to Google Sheets
        run: python src/write_sectoral_to_sheets.py

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: sectoral snapshot $(date -u +%Y-%m-%d)"
          git push

      - name: Clean up credentials
        if: always()
        run: rm -f credentials/service_account.json
